<title>Ralph.app</title>
<style>
:root{--bg:#f2f6fa;--ink:#0b1b2b;--mut:#6b7a8c;--acc:#0a84ff;--acc2:#2ad4c9;--soft:#e6f4fb;--sh:0 1px 2px rgba(10,40,80,.06),0 4px 14px rgba(10,60,120,.08);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",sans-serif;font-size:17px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
#top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(10,100,180,.22);transition:background .3s}
.row{display:flex;align-items:center;gap:10px}.row.end{justify-content:flex-end;flex-wrap:wrap}.grow{flex:1;min-width:0}
.me{width:48px;height:48px;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:rgba(255,255,255,.25);font-size:28px;display:grid;place-items:center;padding:0}
.hi{flex:1;min-width:0}.hi small{display:block;opacity:.9;font-size:13px}.hi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stars{border:0;background:rgba(255,255,255,.95);color:#e08a00;border-radius:99px;padding:7px 13px;font-size:17px;font-weight:600}
.stars b{color:var(--ink)}
.nxt{margin-top:10px}.nxt small{opacity:.95;font-size:12px}
.bar{height:10px;background:#e3ecf4;border-radius:99px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .5s}
.bar.w{background:rgba(255,255,255,.3);height:9px}.bar.w>i{background:#fff}
main{padding:14px 12px}
.card{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.chips{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:#fff;border-radius:99px;padding:8px 14px;white-space:nowrap;box-shadow:var(--sh);font-weight:600;font-size:15px;color:var(--mut)}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.chip small{opacity:.8;font-weight:500}
.masonry{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.note{border-radius:18px;padding:12px;box-shadow:0 4px 12px rgba(10,60,120,.1);min-width:0}
.nh{display:flex;align-items:flex-start;gap:6px;margin-bottom:4px}.nh b{flex:1;font-size:17px}
.mini{border:0;background:rgba(0,0,0,.06);border-radius:10px;padding:2px 9px;font-size:16px}
.it{display:flex;align-items:flex-start;gap:9px;padding:6px 0}
.ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid rgba(11,27,43,.28);display:grid;place-items:center;background:rgba(255,255,255,.7);font-size:16px;font-weight:800;padding:0;color:#fff}
.it.done .ck{background:#34c759;border-color:#34c759;animation:pop .35s}
.tx{flex:1;padding-top:4px;line-height:1.3;overflow-wrap:break-word}
.it.done .tx{text-decoration:line-through;opacity:.5}
.del{border:0;background:none;opacity:.3;font-size:13px;padding:6px 2px}
.add input,.add2 input{width:100%;border:0;background:rgba(255,255,255,.6);border-radius:12px;padding:9px 10px;font:inherit;font-size:16px;margin-top:4px;outline:none}
.add2{display:flex;gap:6px;align-items:center}.add2 .dt{width:130px;flex:none}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:32px;font-weight:300;box-shadow:0 8px 20px rgba(10,110,200,.35);z-index:25;line-height:1}
.fab:active{transform:scale(.92)}
nav#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(249,251,253,.86);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);padding:5px 4px calc(4px + env(safe-area-inset-bottom));border-top:.5px solid rgba(0,0,0,.15);z-index:30}
nav#tabs button{flex:1;min-width:0;border:0;background:none;font-size:9px;line-height:1.05;letter-spacing:-.02em;text-align:center;font-weight:500;color:#8a96a3;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:4px 0}
nav#tabs button .i{font-size:21px;transition:transform .2s;filter:grayscale(1) opacity(.55)}
nav#tabs button.on{color:var(--acc)}
nav#tabs button.on .i{filter:none}
nav#tabs button.on .i{transform:scale(1.18) translateY(-2px)}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}.empty .e{font-size:58px}.empty b{display:block;color:var(--ink);font-size:19px;margin:6px 0}
.lead{background:var(--soft);border-radius:16px;padding:11px 13px;margin:0 0 12px;font-size:14px;line-height:1.4}
.btn{border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:600}
.btn.sm{padding:7px 12px;font-size:15px;border-radius:10px}
.btn.big{width:100%;padding:15px;font-size:17px;margin-top:14px;border-radius:14px}
.btn.ghost{background:var(--soft);color:var(--acc)}
.btn.danger{background:#fff0f0;color:#ff3b30;width:100%;margin-top:8px}
.cht{display:block;font-size:17px}.chav{font-size:26px}
.cnt{text-align:center;margin:6px 0}.cnt b{font-size:48px;font-weight:800;letter-spacing:-.03em;color:var(--acc)}.cnt span{display:block;color:var(--mut);font-size:14px;margin-top:-4px}
.cbtn{margin:8px 0}.cbtn .btn{flex:1;padding:12px 0;font-size:17px}
.chwon{background:linear-gradient(135deg,#fff8d9,#fff 60%)}
/* jocuri */
.gcard{display:flex;align-items:center;gap:12px;width:100%;border:0;background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);text-align:left}
.gcard .gi{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:30px;background:var(--soft);flex:none}

.gcard.lock{opacity:.55}.gcard .pct{font-weight:700;color:var(--acc);font-size:15px}
.gbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}.gbar b{font-size:18px;flex:1;min-width:0}
.nokia{background:#8fa58a;border-radius:24px;padding:12px;box-shadow:inset 0 2px 10px rgba(0,0,0,.3);position:relative}
.nk-top{display:flex;justify-content:space-between;font:700 15px ui-monospace,Menlo,monospace;color:#43523d;background:#c7f0d8;padding:5px 8px;border-bottom:2px solid #43523d;margin:0 auto}
#snk{display:block;margin:0 auto;touch-action:none}
#snkMsg{position:absolute;left:12px;right:12px;bottom:12px;top:12px;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(199,240,216,.9);color:#43523d;font:800 19px/1.4 ui-monospace,Menlo,monospace;white-space:pre-line;border-radius:4px}
.dpad{display:grid;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(3,58px);gap:7px;justify-content:center;margin-top:14px}
.dpad button{border:0;border-radius:16px;background:#2f3a2b;color:#c7f0d8;font-size:26px;touch-action:manipulation;-webkit-user-select:none}
.dpad button:active{background:#56684f}.dpad .pl{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:15px;font-weight:800}
.tq{font-size:20px;font-weight:700;line-height:1.3;margin:12px 0 4px;letter-spacing:-.015em}
.ans{display:block;width:100%;text-align:left;border:1.5px solid #dfe6ee;background:#fff;border-radius:14px;padding:14px;margin-top:9px;font-size:16.5px;font-weight:500;color:var(--ink)}
.ans.ok{background:#e3f9e9;border-color:#34c759;font-weight:700}.ans.bad{background:#ffecec;border-color:#ff3b30}
.expl{background:var(--soft);border-radius:12px;padding:11px 12px;margin-top:12px;font-size:15px;line-height:1.45}
.setb{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#f5f9fc;border-radius:12px;padding:12px;margin-top:8px;text-align:left;font-size:15.5px}
.setb b{flex:1}.setb span{color:var(--mut);font-size:13px;white-space:nowrap}
.gq{display:flex;align-items:center;gap:12px;min-height:78px}
.gq img,.gq .ph0{width:76px;height:76px;border-radius:14px;object-fit:cover;flex:none;background:var(--soft);display:grid;place-items:center;font-size:36px}
.gq .big{font-size:22px;font-weight:800;line-height:1.15;letter-spacing:-.02em}.gq .flag{font-size:62px;line-height:1}
.gq small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.gq p{margin:6px 0 0;font-size:15px;line-height:1.4}
.ginfo{border:2px solid #34c759}.ginfo.miss{border-color:#ff9f0a}
.mapbox{position:relative;background:#cfe8f7;border-radius:16px;overflow:hidden;box-shadow:var(--sh);margin-bottom:12px;display:flex;justify-content:center}
#map{display:block;touch-action:none}
#map path{stroke:#fff;stroke-width:.8;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#map .np{fill:#e6eaee}#map .pc{fill:#a9cdea}#map .old{fill:#bfe6c9}
#map .dot{stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke}
#map .got{fill:#34c759}#map .wrong{fill:#ff3b30}#map .hint{animation:hint .9s infinite}
@keyframes hint{50%{fill:#ffd60a}}
.zbtn{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zbtn button{width:38px;height:38px;border-radius:10px;border:0;background:rgba(255,255,255,.92);font-size:19px;box-shadow:var(--sh)}
.carph{margin:12px -4px 4px;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-size:60px}
.carph img{width:100%;height:100%;object-fit:cover}
.gprog{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:6px}
.banner{display:flex;gap:10px;align-items:center;background:linear-gradient(135deg,#0a84ff,#2ad4c9);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14.5px;line-height:1.35}
.banner .btn{background:#fff;color:#0a84ff;flex:none}
.share-ic{display:inline-block;border:1.5px solid currentColor;border-radius:4px;padding:0 4px;font-size:12px}
.btn:active{transform:scale(.96)}
/* prieteni */
.friend{padding:0;overflow:hidden}
summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}
.friend>summary{display:flex;align-items:center;gap:12px;padding:12px 14px}
.av{flex:none;width:58px;height:58px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:30px;overflow:hidden;border:3px solid var(--acc2)}
.av img{width:100%;height:100%;object-fit:cover}
.fn{flex:1;min-width:0}.fn b{display:block;font-size:18px}.fn small{color:var(--mut)}
.chev{font-size:26px;color:var(--mut);transition:transform .2s}
details[open]>summary .chev{transform:rotate(90deg)}
.fb{padding:0 14px 14px}
.sec-t{font-weight:700;margin:8px 0 2px}
.sub{background:var(--soft);border-radius:14px;margin-top:8px}
.sub>summary{padding:11px 12px;font-weight:600;display:flex;gap:6px}
.sub>summary::after{content:"▾";margin-left:auto;transition:transform .2s}
.sub[open]>summary::after{transform:rotate(180deg)}
.sub textarea{display:block;width:calc(100% - 16px);margin:0 8px 8px;border:0;border-radius:12px;padding:10px;font:inherit;font-size:16px;resize:vertical;outline:none;min-height:70px}
.date{font-style:normal;font-size:12px;background:var(--soft);border-radius:8px;padding:1px 6px;margin-left:4px;white-space:nowrap}
/* smart */
.goal .gt{flex:1;font-size:17px}
.star{border:0;background:none;font-size:28px;color:#ccc;padding:0 2px;line-height:1}.star.on{color:#ffb800}
.badge{font-size:12px;font-weight:700;border-radius:99px;padding:4px 9px;background:#eee;white-space:nowrap}
.gact .badge{background:#ffe9d6;color:#e8590c}.gdone .badge{background:#dff7ea;color:#17a673}.glock .badge{background:#eee;color:#777}
.smart{display:flex;gap:6px;margin:12px 0 6px}
.L{flex:1;border:2px dashed #c9d6e2;background:#f5f9fc;border-radius:14px;padding:6px 0;display:flex;flex-direction:column;align-items:center}
.L b{font-size:22px;color:#a9b8c6}.L small{font-size:9.5px;color:var(--mut)}
.L.ok{border:2px solid #17a673;background:#e3f8ee;animation:pop .35s}.L.ok b{color:#17a673}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}
.due{font-size:13px;margin-top:8px;color:var(--mut)}
.gdone{opacity:.85}
.h2{font-size:18px;font-weight:800;margin:16px 4px 8px}
.bigL{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:34px;font-weight:900;display:grid;place-items:center;flex:none}
.ex{background:var(--soft);border-radius:12px;padding:10px;font-size:14px}
/* vise */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dream{padding:0;overflow:hidden;margin:0}
.ph{position:relative;aspect-ratio:1/1;background:linear-gradient(135deg,#dff1fb,#d9f7f3);display:grid;place-items:center;text-align:center;font-size:34px;color:var(--mut)}
.ph small{font-size:12px}
.ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ph .cam{position:absolute;right:8px;bottom:8px;font-style:normal;font-size:14px;background:rgba(255,255,255,.9);border-radius:99px;padding:3px 8px}
.ph .ok{position:absolute;left:8px;top:8px;font-style:normal;font-size:13px;background:#ffd60a;color:#5a4400;border-radius:99px;padding:3px 9px;font-weight:700}
.thumbs{display:flex;gap:4px;padding:6px 8px 0;overflow-x:auto}
.thumbs img{width:38px;height:38px;border-radius:9px;object-fit:cover;flex:none}
.db{padding:10px}.db b{display:block}.db small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.db .row{margin-top:8px;gap:6px}
.ddone .ph::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 5px #ffd60a}
/* banca */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:#fff;border-radius:18px;padding:12px;box-shadow:var(--sh);border:0;text-align:left}
.tile .ic{font-size:24px}.tile small{display:block;color:var(--mut);font-size:12px}.tile b{display:block;font-size:19px;margin:2px 0}
.tile .s{font-size:11.5px;color:var(--mut)}
.stack{display:flex;height:22px;border-radius:99px;overflow:hidden;margin:10px 0 8px;background:#eee}
.stack i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}
.tip{padding:9px 0;border-top:1px solid #edf2f6;font-size:14px;line-height:1.4}.tip:first-of-type{border-top:0}
.golden{background:linear-gradient(135deg,#fff7d6,#ffe9b3);font-size:14px;line-height:1.45}
.ent .ava{font-size:28px;width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none}
.ent b{font-size:17px}.ent small{display:block;color:var(--mut);font-size:12.5px}
.amt{font-size:17px;white-space:nowrap}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13.5px;margin:12px 0 8px;background:#f5f9fc;border-radius:12px;padding:10px}
.kv span{color:var(--mut)}.kv b{font-size:13.5px;text-align:right}
.grade{font-weight:900;font-size:15px;border-radius:12px;padding:5px 10px;color:#fff;white-space:nowrap}
.warn{background:#fff1e6;border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0}
.okb{background:#e3f8ee;border-radius:10px;padding:8px 10px;font-size:13px;margin:6px 0}
.sc{display:flex;gap:6px;font-size:11.5px;margin:6px 0}.sc div{flex:1;background:#f5f9fc;border-radius:10px;padding:6px;text-align:center}.sc b{display:block;font-size:15px}
.gl{margin-bottom:10px}.gl b{font-size:16px}.gl p{margin:4px 0 0;font-size:14px;line-height:1.45;color:#3c4a58}
#calc .fl{margin-top:8px}
.res{background:var(--soft);border-radius:14px;padding:12px;margin-top:12px;font-size:15px;line-height:1.6}
.res b{font-size:20px}
.medal{font-size:20px}
/* sheet & forms */
#sheet{position:fixed;inset:0;z-index:50;display:none}#sheet.on{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(5,20,40,.5);animation:fade .2s}
.sheet-card{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;background:#f7f9fb;border-radius:14px 14px 0 0;padding:22px 16px calc(24px + env(safe-area-inset-bottom));animation:up .32s cubic-bezier(.2,.9,.25,1)}

.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}.sh-head b{flex:1;font-size:20px}.sh-head>div{flex:1}
.x{border:0;background:#e9eef3;border-radius:50%;width:36px;height:36px;font-size:16px;flex:none}
.mut{color:var(--mut);font-size:14px}
.fl{display:block;margin-top:12px}.fl-l{display:block;font-weight:700;font-size:14px;margin-bottom:5px}

.fl input:focus,.fl textarea:focus,#lt:focus{border-color:var(--acc)}
.fh{display:block;color:var(--mut);font-size:12.5px;margin-top:4px;line-height:1.35}
.chk{display:flex;align-items:center;gap:8px;font-weight:600}.chk input{width:22px;height:22px;-webkit-appearance:auto;appearance:auto}
.starsel button{border:0;background:none;font-size:34px;color:#ddd;padding:0 3px}.starsel button.on{color:#ffb800}
.colsel,.emosel{display:flex;flex-wrap:wrap;gap:8px}
.colsel button{width:38px;height:38px;border-radius:50%;border:2px solid #ddd}.colsel button.on{border:3px solid var(--ink);transform:scale(1.1)}

.phsel{display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:var(--soft);font-size:36px;overflow:hidden;border:3px dashed var(--acc2);position:relative}
.phsel img{width:100%;height:100%;object-fit:cover}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;pointer-events:none}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:#0b1b2b;color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;z-index:70;transition:transform .3s cubic-bezier(.2,.9,.3,1.3);box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw;text-align:center;font-size:15px}
#toast.on{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.bdg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.bdg div{text-align:center;background:#f5f9fc;border-radius:14px;padding:8px 2px;font-size:11px}
.bdg div i{display:block;font-style:normal;font-size:30px}.bdg .lk{opacity:.35;filter:grayscale(1)}
.rw{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid #edf2f6}
.trophy{text-align:center;padding:10px 0}.trophy .t{font-size:90px;animation:pop .6s}.trophy b{display:block;font-size:24px;margin:6px 0}
.cert img{width:100%;border-radius:12px;box-shadow:var(--sh);-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.viewer img{width:100%;border-radius:14px}
</style>
</head>
<body>
<header id="top"></header>
<main id="main"></main>
<nav id="tabs"></nav>
<div id="sheet"></div>
<div id="toast"></div>
<canvas id="fx"></canvas>
<input type="file" id="picker" accept="image/*" class="vh">
<script>
'use strict';
/* ---------- utilitare ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const r2=n=>Math.round((+n||0)*100)/100;
const lei=n=>r2(n).toLocaleString('ro-RO',{maximumFractionDigits:2})+' lei';
const pct=n=>(Math.round((+n||0)*10)/10).toLocaleString('ro-RO')+'%';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const D=s=>new Date(s+'T12:00');
const fmtD=s=>s?D(s).toLocaleDateString('ro-RO',{day:'numeric',month:'short',year:'numeric'}):'';
const addM=(s,m)=>{const d=D(s);d.setMonth(d.getMonth()+(+m||0));return d.toISOString().slice(0,10)};
const daysTo=s=>Math.round((D(s)-D(today()))/864e5);
const daysLeft=s=>{const n=daysTo(s);return n>1?`· mai sunt ${n} zile`:n===1?'· mâine!':n===0?'· azi!':'· termenul a trecut'};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const PRAISE=['Bravo!','Super!','Ești tare!','Campion!','Așa da!','Wow!','Excelent!','Ce frumos!','Fantastic!','Încă unul!'];
const KEEP=['#fff6bf','#d9f2e3','#ffe3e3','#cff7f0','#d7f0ff','#e4e9ff','#f1e4ff','#ffffff'];
const AVATARS=['🦸','🦁','🐯','🦊','🐼','🐸','🐵','🦖','🐲','🚀','⚽','🎮','🤖','👾','🧙','🥷'];
const FEMO=['🙂','😎','🤓','😄','🦁','🐶','⚽','🎮','🎸','🏀','🚲','🧩'];
const BADGES=[[10,'🥉','Începător'],[25,'🥈','Harnic'],[50,'🥇','Campion'],[100,'🏆','Super-erou'],[200,'💎','Diamant'],[350,'👑','Regele planurilor'],[500,'🚀','Legendă']];

/* ---------- memorie (IndexedDB, cu rezervă localStorage) ---------- */
const DB={db:null,
 open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('ralph',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
 get(k){return new Promise((res,rej)=>{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
 set(k,v){return new Promise((res,rej)=>{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}};
let S,saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(async()=>{try{if(!DB.db)throw 0;await DB.set('state',JSON.parse(JSON.stringify(S)))}catch(e){try{localStorage.setItem('ralph',JSON.stringify(S))}catch(e2){toast('⚠️ Memoria e plină — fă o copie de rezervă')}}},250)}

function defState(){const d=today();return{v:1,
 profile:{name:'Ralph',avatar:'🦸',stars:0,spent:0,badges:[],sound:true,created:d,lastBackup:'',welcomed:false},
 rewards:[{id:uid(),name:'30 min de joc în plus',cost:30},{id:uid(),name:'Aleg eu filmul de seară',cost:50},{id:uid(),name:'Ieșire la înghețată',cost:80}],
 notes:[
  {id:uid(),scope:'zi',title:'Azi 🌞',color:'#fff6bf',items:[{id:uid(),text:'Îmi fac patul',done:false},{id:uid(),text:'Temele la mate',done:false},{id:uid(),text:'30 de minute de citit',done:false}]},
  {id:uid(),scope:'zi',title:'După școală',color:'#f1e4ff',items:[{id:uid(),text:'Antrenament',done:false},{id:uid(),text:'Pregătesc ghiozdanul',done:false}]},
  {id:uid(),scope:'sapt',title:'Săptămâna asta',color:'#cff7f0',items:[{id:uid(),text:'Sun bunicii',done:false},{id:uid(),text:'Fac ordine în cameră',done:false}]},
  {id:uid(),scope:'luna',title:'Luna asta 🚀',color:'#d7f0ff',items:[{id:uid(),text:'Termin o carte întreagă',done:false}]}],
 friends:[],
 goals:[{id:uid(),title:'Să înot 25 m fără pauză',top:true,activated:false,done:false,steps:[],
  L:{S:{t:'Să învăț să înot craul',ok:true},M:{t:'',ok:false},A:{t:'',ok:false},R:{t:'',ok:false},T:{t:'',ok:false,date:''}}}],
 dreams:[{id:uid(),title:'O bicicletă nouă',why:'Să merg cu prietenii în parc',cost:1200,saved:150,photos:[],done:false}],
 bank:{name:'',inflation:6,
  deps:[{id:uid(),name:'Mama',type:'recurent',amount:50,freq:'lunar',start:d,months:12,rate:3}],
  invs:[{id:uid(),name:'Tata',amount:200,date:d,exp:5}],
  loans:[],
  projects:[{id:uid(),name:'Stand de limonadă',desc:'Vând limonadă în parc, vara',invest:100,ret:160,months:3,risk:2,status:'idee'}]}}}

/* ---------- artificii + sunet ---------- */
const fx={c:null,x:null,p:[],run:false};
const FXC=['#0a84ff','#2ad4c9','#5ac8fa','#ffd60a','#34c759','#ff9f0a','#bf5af2'];
function fxSize(){const r=devicePixelRatio||1;fx.c.width=innerWidth*r;fx.c.height=innerHeight*r;fx.x.setTransform(r,0,0,r,0,0)}
function burst(x,y,n=36,pw=1){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(2+Math.random()*6)*pw;fx.p.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5*pw,l:0,L:55+Math.random()*40,c:FXC[i%FXC.length],r:3+Math.random()*4,sh:Math.random()<.14?'s':Math.random()<.5?'c':'r',rot:Math.random()*6})}
 if(!fx.run){fx.run=true;requestAnimationFrame(fxLoop)}}
function fxLoop(){const x=fx.x;x.clearRect(0,0,innerWidth,innerHeight);fx.p=fx.p.filter(p=>p.l<p.L);
 for(const p of fx.p){p.l++;p.vy+=.16;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=.2;x.globalAlpha=Math.max(0,1-p.l/p.L);
  if(p.sh==='s'){x.font='18px sans-serif';x.fillText('⭐',p.x,p.y)}else{x.fillStyle=p.c;if(p.sh==='c'){x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}else{x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()}}}
 x.globalAlpha=1;if(fx.p.length)requestAnimationFrame(fxLoop);else fx.run=false}
function fireworks(){for(let k=0;k<8;k++)setTimeout(()=>burst(innerWidth*(.12+Math.random()*.76),innerHeight*(.12+Math.random()*.45),60,1.3),k*200);chime(true)}
let AC;function chime(big){if(!S.profile.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;(big?[523,659,784,1047,1319]:[784,1175]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=t0+i*.09;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.45)})}catch(e){}}
const pos=el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};
const mid=()=>({x:innerWidth/2,y:innerHeight/2.6});

/* recompense: stele, premii */
function reward(n,p,big){const pr=S.profile;pr.stars=Math.max(0,pr.stars+n);
 if(n>0){p=p||mid();burst(p.x,p.y,big?70:34,big?1.3:1);big?fireworks():chime();toast(pick(PRAISE)+' +'+n+' ⭐')}
 save();setTimeout(checkBadges,big?900:300)}
function checkBadges(){const pr=S.profile;const nb=BADGES.find(b=>pr.stars>=b[0]&&!pr.badges.includes(b[0]));if(!nb)return;pr.badges.push(nb[0]);save();fireworks();
 sheet(`<div class="trophy"><div class="t">${nb[1]}</div><b>Premiu nou: ${nb[2]}!</b><div class="mut">Ai strâns ${nb[0]} stele. Ești minunat! 🎉</div><button class="btn big" data-act="closeSheet">Yeee! 🙌</button></div>`);renderTop()}

/* ---------- toast + sheet + formulare ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}
function sheet(html,mount){const o=$('#sheet');o.innerHTML=`<div class="sheet-bg" data-act="closeSheet"></div><div class="sheet-card">${html}</div>`;o.classList.add('on');mount&&mount(o)}
function closeSheet(){const o=$('#sheet');o.classList.remove('on');o.innerHTML=''}
function fieldHTML(f,v){const h=f.hint?`<small class="fh">${f.hint}</small>`:'';const L=`<span class="fl-l">${f.l}</span>`;
 switch(f.t){
  case 'textarea':return `<label class="fl">${L}<textarea name="${f.k}" rows="${f.rows||3}" placeholder="${esc(f.ph||'')}">${esc(v??'')}</textarea>${h}</label>`;
  case 'select':return `<label class="fl">${L}<select name="${f.k}">${f.o.map(([a,b])=>`<option value="${a}" ${String(v??f.o[0][0])===String(a)?'selected':''}>${b}</option>`).join('')}</select>${h}</label>`;
  case 'num':return `<label class="fl">${L}<input name="${f.k}" inputmode="decimal" value="${v??''}" placeholder="${esc(f.ph||'0')}" autocomplete="off">${h}</label>`;
  case 'date':return `<label class="fl">${L}<input type="date" name="${f.k}" value="${v||''}">${h}</label>`;
  case 'stars':return `<div class="fl">${L}<div class="starsel" data-k="${f.k}" data-v="${v||0}">${[1,2,3,4,5].map(i=>`<button type="button" data-act="starSel" data-i="${i}" class="${i<=(v||0)?'on':''}">★</button>`).join('')}</div>${h}</div>`;
  case 'color':{const c=v||KEEP[0];return `<div class="fl">${L}<div class="colsel" data-k="${f.k}" data-v="${c}">${KEEP.map(x=>`<button type="button" data-act="optSel" data-v="${x}" style="background:${x}" class="${x===c?'on':''}"></button>`).join('')}</div></div>`}
  case 'emoji':{const c=v||f.o[0];return `<div class="fl">${L}<div class="emosel" data-k="${f.k}" data-v="${c}">${f.o.map(x=>`<button type="button" data-act="optSel" data-v="${x}" class="${x===c?'on':''}">${x}</button>`).join('')}</div></div>`}
  case 'photo':return `<div class="fl">${L}<label class="phsel" data-k="${f.k}">${v?`<img src="${v}">`:'📷'}<input type="file" accept="image/*" class="vh" data-photo="${f.k}"></label>${h}</div>`;
  case 'check':return `<label class="fl chk"><input type="checkbox" name="${f.k}" ${v?'checked':''}> ${f.l}</label>`;
  default:return `<label class="fl">${L}<input name="${f.k}" value="${esc(v??'')}" placeholder="${esc(f.ph||'')}" autocomplete="off">${h}</label>`}}
function readForm(fm,fields){const o={};for(const f of fields){
 if(f.t==='stars'||f.t==='color'||f.t==='emoji')o[f.k]=f.t==='stars'?+fm.querySelector(`[data-k="${f.k}"]`).dataset.v:fm.querySelector(`[data-k="${f.k}"]`).dataset.v;
 else if(f.t==='photo')o[f.k]=fm.querySelector(`.phsel[data-k="${f.k}"]`)._v||'';
 else if(f.t==='check')o[f.k]=fm.elements[f.k].checked;
 else if(f.t==='num')o[f.k]=num(fm.elements[f.k].value);
 else o[f.k]=fm.elements[f.k].value.trim()}return o}
function formSheet({title,fields,data={},onSave,onDelete,top=''}){
 sheet(`<div class="sh-head"><b>${title}</b><button type="button" class="x" data-act="closeSheet">✕</button></div>${top}<form id="fs">${fields.map(f=>fieldHTML(f,data[f.k])).join('')}<button class="btn big" type="submit">💾 Salvează</button>${onDelete?'<button type="button" class="btn danger" id="fsDel">🗑️ Șterge</button>':''}</form>`,o=>{
  const fm=o.querySelector('#fs');fields.filter(f=>f.t==='photo').forEach(f=>fm.querySelector(`.phsel[data-k="${f.k}"]`)._v=data[f.k]||'');
  fm.onsubmit=e=>{e.preventDefault();const v=readForm(fm,fields);const miss=fields.find(f=>f.req&&!v[f.k]);if(miss){toast('Completează: '+miss.l);return}closeSheet();onSave(v);save();render()};
  if(onDelete)o.querySelector('#fsDel').onclick=()=>{if(confirm('Sigur ștergi?')){closeSheet();onDelete();save();render()}}})}
function loadImg(file,max=900){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.78))};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
function pickPhoto(cb,max){const p=$('#picker');p.value='';p.onchange=async()=>{const f=p.files[0];if(!f)return;try{cb(await loadImg(f,max));save();render()}catch(e){toast('Nu am putut încărca poza 😕')}};p.click()}
const empty=(e,t,s)=>`<div class="empty"><div class="e">${e}</div><b>${t}</b>${s}</div>`;
const itemHTML=(x,act,attrs)=>`<div class="it ${x.done?'done':''}"><button class="ck" data-act="${act}" ${attrs} data-id="${x.id}">${x.done?'✓':''}</button><span class="tx" data-act="${act}" ${attrs} data-id="${x.id}">${esc(x.text)}${x.date?` <em class="date">📅 ${fmtD(x.date)}</em>`:''}</span><button class="del" data-act="del_${act}" ${attrs} data-id="${x.id}">✕</button></div>`;

/* ---------- capitole ---------- */
const TABS=[
 {id:'agenda',ico:'📅',name:'Agenda',title:'Agenda mea',c1:'#0a84ff',c2:'#2ad4c9',soft:'#e3f3fb'},
 {id:'prieteni',ico:'🤝',name:'Prieteni',title:'Prietenii mei',c1:'#1e6bff',c2:'#5ac8fa',soft:'#e6f0ff'},
 {id:'smart',ico:'🎯',name:'Obiective',title:'Obiective SMART',c1:'#0898b8',c2:'#30d5b0',soft:'#e0f6f2'},
 {id:'vise',ico:'🌈',name:'Vise',title:'Vise și dorințe',c1:'#3d5afe',c2:'#2ac8e6',soft:'#e8edff'},
 {id:'provocari',ico:'⚡',name:'Provocări',title:'Provocări',c1:'#0a6cff',c2:'#00d4ff',soft:'#e3f4ff'},
 {id:'neagra',ico:'⛔',name:'Lista neagră',title:'Lista neagră',c1:'#14213d',c2:'#1f8fff',soft:'#e7edf5'},
 {id:'banca',ico:'🏦',name:'Banca',title:'',c1:'#0057d9',c2:'#00c2d1',soft:'#e1f1fb'},
 {id:'jocuri',ico:'🎮',name:'Jocuri',title:'Jocuri',c1:'#2563eb',c2:'#22d3ee',soft:'#e4f3fd'}];
let UI={tab:'agenda',scope:'zi',bank:'panou',open:new Set()};
try{const t=localStorage.getItem('ralph_tab');if(TABS.some(x=>x.id===t))UI.tab=t}catch(e){}
const VIEWS={},A={},FORMS={};
const bankName=()=>S.bank.name||('Banca lui '+(S.profile.name||'Campion'));

function renderTop(){const t=TABS.find(x=>x.id===UI.tab),p=S.profile;const nb=BADGES.find(b=>p.stars<b[0]);const pv=[...BADGES].reverse().find(b=>p.stars>=b[0]);const lo=pv?pv[0]:0;
 $('#top').innerHTML=`<div class="row"><button class="me" data-act="settings">${esc(p.avatar)}</button><div class="hi"><small>Salut, ${esc(p.name||'campionule')}! ${p.badges.map(b=>BADGES.find(x=>x[0]===b)[1]).join('')}</small><b>${t.ico} ${esc(t.title||bankName())}</b></div><button class="stars" data-act="prizes">⭐ <b>${p.stars}</b></button></div>
 <div class="nxt">${nb?`<div class="bar w"><i style="width:${(p.stars-lo)/(nb[0]-lo)*100}%"></i></div><small>Următorul premiu: ${nb[1]} ${nb[2]} la ${nb[0]} ⭐</small>`:'<small>Ai toate premiile! Ești o legendă 🚀</small>'}</div>`}
function render(){const t=TABS.find(x=>x.id===UI.tab);const st=document.documentElement.style;st.setProperty('--acc',t.c1);st.setProperty('--acc2',t.c2);st.setProperty('--soft',t.soft);
 if(UI.tab!=='jocuri'||UI.game!=='snake')snakeStop();
 renderTop();$('#main').innerHTML=(UI.tab==='jocuri'&&UI.game?'':banners())+VIEWS[UI.tab]();if(UI.tab==='jocuri')gameMount();
 $('#tabs').innerHTML=TABS.map(x=>`<button class="${x.id===UI.tab?'on':''}" data-act="tab" data-k="${x.id}"><span class="i">${x.ico}</span>${x.name}</button>`).join('')}

/* ===== 1. AGENDA ===== */
const SCOPES=[['zi','☀️ Azi'],['sapt','📆 Săptămâna'],['luna','🗓️ Luna']];
VIEWS.agenda=()=>{const ns=S.notes.filter(n=>n.scope===UI.scope),all=ns.flatMap(n=>n.items),dn=all.filter(i=>i.done).length;
 return `<div class="chips">${SCOPES.map(([k,l])=>{const its=S.notes.filter(n=>n.scope===k).flatMap(n=>n.items);return `<button class="chip ${UI.scope===k?'on':''}" data-act="scope" data-k="${k}">${l} <small>${its.filter(i=>i.done).length}/${its.length}</small></button>`}).join('')}</div>
 <div class="card"><div class="row"><b class="grow">${all.length&&dn===all.length?'🎉 Ai terminat tot! Ești super!':UI.scope==='zi'?'Planul de azi · '+new Date().toLocaleDateString('ro-RO',{weekday:'long',day:'numeric',month:'long'}):'Progresul tău'}</b><b>${dn}/${all.length}</b></div><div class="bar"><i style="width:${all.length?dn/all.length*100:0}%"></i></div></div>
 ${ns.length?`<div class="masonry">${ns.map(n=>`<div class="note" style="background:${n.color}"><div class="nh"><b>${esc(n.title)}</b><button class="mini" data-act="editNote" data-id="${n.id}">⋯</button></div>
  ${n.items.map(i=>itemHTML(i,'tItem',`data-n="${n.id}"`)).join('')}
  <form class="add" data-form="addItem" data-id="${n.id}"><input name="t" placeholder="＋ adaugă" enterkeyhint="done" autocomplete="off"></form></div>`).join('')}</div>`:empty('📝','Nicio listă încă','Apasă pe ＋ ca să-ți faci prima listă.')}
 <button class="fab" data-act="addNote">＋</button>`};
const noteF=[{k:'title',l:'Titlu',ph:'ex: Azi, Weekend, Vacanța',req:1},{k:'scope',l:'Pentru',t:'select',o:[['zi','☀️ Azi'],['sapt','📆 Săptămâna asta'],['luna','🗓️ Luna asta']]},{k:'color',l:'Culoare',t:'color'},{k:'items',l:'Ce am de făcut (câte unul pe rând)',t:'textarea',rows:5,ph:'Teme\nAntrenament\nCitit'}];
A.scope=d=>{UI.scope=d.k;render()};
A.addNote=()=>formSheet({title:'📝 Listă nouă',fields:noteF,data:{scope:UI.scope},onSave:v=>{S.notes.unshift({id:uid(),scope:v.scope,title:v.title,color:v.color,items:v.items.split('\n').map(s=>s.trim()).filter(Boolean).map(text=>({id:uid(),text,done:false}))});UI.scope=v.scope}});
A.editNote=d=>{const n=S.notes.find(x=>x.id===d.id);formSheet({title:'✏️ Editez lista',fields:noteF,data:{...n,items:n.items.map(i=>i.text).join('\n')},onSave:v=>{const old=n.items;Object.assign(n,{title:v.title,scope:v.scope,color:v.color});n.items=v.items.split('\n').map(s=>s.trim()).filter(Boolean).map(text=>old.find(o=>o.text===text)||{id:uid(),text,done:false})},onDelete:()=>S.notes=S.notes.filter(x=>x!==n)})};
A.tItem=(d,el)=>{const n=S.notes.find(x=>x.id===d.n),i=n.items.find(x=>x.id===d.id);const was=n.items.every(x=>x.done);i.done=!i.done;
 if(i.done){const all=n.items.every(x=>x.done);reward(all?4:1,pos(el),all);if(all)setTimeout(()=>toast('🏁 Ai terminat lista „'+n.title+'”!'),1300)}else reward(was?-4:-1);render()};
A.del_tItem=d=>{const n=S.notes.find(x=>x.id===d.n);n.items=n.items.filter(x=>x.id!==d.id);save();render()};
FORMS.addItem=f=>{const t=f.t.value.trim();if(!t)return;S.notes.find(x=>x.id===f.dataset.id).items.push({id:uid(),text:t,done:false});save();render();refocus('addItem',f.dataset.id)};

/* --- Snake (ca pe Nokia: trece prin pereți, moare dacă se mușcă) --- */
const SN={N:21};
function snakeView(){return `${backBtn('🐍 Snake')}<div class="nokia"><div class="nk-top" id="nkTop"><span id="snkSc">0000</span><span>REC ${String(S.games.snake.best||0).padStart(4,'0')}</span></div><canvas id="snk"></canvas><div id="snkMsg" data-act="snkPlay">SNAKE\n\n▶ Apasă ca să începi</div></div>
 <div class="dpad"><span></span><button data-d="0,-1">▲</button><span></span><button data-d="-1,0">◀</button><button class="pl" data-act="snkPlay">START</button><button data-d="1,0">▶</button><span></span><button data-d="0,1">▼</button><span></span></div>
 <p class="hint" style="text-align:center">Poți și glisa cu degetul pe ecran. ⭐ pentru fiecare 5 mere.</p>`}
function snakeInit(){const c=$('#snk');if(!c)return;const W=Math.min(c.parentNode.clientWidth-24,400);SN.cell=Math.floor(W/SN.N);const px=SN.cell*SN.N,r=devicePixelRatio||1;
 c.width=px*r;c.height=px*r;c.style.width=c.style.height=px+'px';$('#nkTop').style.width=px+'px';SN.x=c.getContext('2d');SN.x.setTransform(r,0,0,r,0,0);
 snakeReset();snakeDraw();
 document.querySelectorAll('.dpad [data-d]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();snakeDir(b.dataset.d.split(',').map(Number))}));
 let t0=null;c.addEventListener('touchstart',e=>{t0=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});
 c.addEventListener('touchend',e=>{if(!t0)return;const dx=e.changedTouches[0].clientX-t0[0],dy=e.changedTouches[0].clientY-t0[1];if(Math.max(Math.abs(dx),Math.abs(dy))>18)snakeDir(Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)]);t0=null},{passive:true})}
function snakeDir(d){if(!SN.alive||!SN.t){return}const q=SN.q;const last=q.length?q[q.length-1]:SN.d;if((d[0]===-last[0]&&d[1]===-last[1])||(d[0]===last[0]&&d[1]===last[1]))return;if(q.length<3)q.push(d)}
addEventListener('keydown',e=>{if(UI.game!=='snake')return;const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();snakeDir(m)}else if(e.key===' '&&!SN.t)A.snkPlay()});
function snakeReset(){const m=Math.floor(SN.N/2);SN.s=[[m-3,m],[m-2,m],[m-1,m],[m,m]];SN.d=[1,0];SN.q=[];SN.score=0;SN.speed=165;SN.alive=true;snakeFood()}
function snakeFood(){do{SN.f=[Math.floor(Math.random()*SN.N),Math.floor(Math.random()*SN.N)]}while(SN.s.some(p=>p[0]===SN.f[0]&&p[1]===SN.f[1]))}
function snakeStop(){clearTimeout(SN.t);SN.t=null}
A.snkPlay=()=>{if(SN.t)return;if(!SN.alive||SN.over){snakeReset();SN.over=false}$('#snkMsg').style.display='none';SN.alive=true;SN.t=setTimeout(snakeTick,SN.speed)};
function beep(f,d){if(!S.profile.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function snakeTick(){if(!$('#snk')){snakeStop();return}if(SN.q.length)SN.d=SN.q.shift();const N=SN.N,h=SN.s[SN.s.length-1],n=[(h[0]+SN.d[0]+N)%N,(h[1]+SN.d[1]+N)%N];
 const eat=n[0]===SN.f[0]&&n[1]===SN.f[1],body=eat?SN.s:SN.s.slice(1);
 if(body.some(p=>p[0]===n[0]&&p[1]===n[1]))return snakeOver();
 SN.s.push(n);if(eat){SN.score++;SN.speed=Math.max(70,SN.speed-4);snakeFood();beep(880,.06);$('#snkSc').textContent=String(SN.score).padStart(4,'0')}else SN.s.shift();
 snakeDraw();SN.t=setTimeout(snakeTick,SN.speed)}
function snakeDraw(){const x=SN.x,c=SN.cell,N=SN.N;x.fillStyle='#c7f0d8';x.fillRect(0,0,c*N,c*N);x.fillStyle='#43523d';
 SN.s.forEach(([a,b])=>x.fillRect(a*c+1,b*c+1,c-2,c-2));const h=SN.s[SN.s.length-1];x.fillStyle='#c7f0d8';x.fillRect(h[0]*c+c/2-1.5,h[1]*c+c/2-1.5,3,3);
 const[a,b]=SN.f,m=c/2;x.fillStyle='#43523d';x.beginPath();x.moveTo(a*c+m,b*c+2);x.lineTo(a*c+c-2,b*c+m);x.lineTo(a*c+m,b*c+c-2);x.lineTo(a*c+2,b*c+m);x.fill()}
function snakeOver(){snakeStop();SN.alive=false;SN.over=true;beep(160,.35);const g=S.games.snake,rec=SN.score>(g.best||0);if(rec)g.best=SN.score;g.games=(g.games||0)+1;
 const st=Math.min(5,Math.floor(SN.score/5));$('#snkMsg').style.display='flex';$('#snkMsg').textContent=`GAME OVER\n\nMere: ${SN.score}${rec&&SN.score?'\n★ RECORD NOU ★':''}\n\n▶ Încă o dată`;
 if(st)reward(st+(rec?2:0),mid(),rec);else save()}

 const q=g.q[g.i],ans=g.ans;
 return `${backBtn(t.emoji+' '+esc(t.seturi[g.s].nume))}<div class="card"><div class="gprog"><span>Întrebarea ${g.i+1} din ${g.q.length}</span><span>✅ ${g.ok}</span></div><div class="bar"><i style="width:${g.i/g.q.length*100}%"></i></div>
 <div class="tq">${esc(q.q)}</div>${q.a.map((a,i)=>`<button class="ans ${ans==null?'':i===q.c?'ok':i===ans?'bad':''}" data-act="trAns" data-i="${i}" ${ans!=null?'disabled':''}>${ans!=null&&i===q.c?'✅ ':ans===i?'❌ ':''}${esc(a)}</button>`).join('')}

const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
A.trStart=d=>{const t=DATA.trivia.teme[+d.t],s=t.seturi[+d.s];G.tr={t:+d.t,s:+d.s,i:0,ok:0,ans:null,end:false,q:shuf(s.intrebari).map(q=>{const o=shuf(q.a.map((a,i)=>({a,i})));return{q:q.q,e:q.e,a:o.map(x=>x.a),c:o.findIndex(x=>x.i===q.c)}})};UI.sub={t:+d.t,s:+d.s};render();scrollTo(0,0)};
A.trAns=(d,el)=>{const g=G.tr;if(g.ans!=null)return;g.ans=+d.i;const p=pos(el);if(g.ans===g.q[g.i].c){g.ok++;burst(p.x,p.y,30);chime()}else beep(200,.15);render()};
A.trNext=()=>{const g=G.tr;g.i++;g.ans=null;if(g.i>=g.q.length){g.end=true;const t=DATA.trivia.teme[g.t],k=t.id+g.s,old=S.games.trivia[k];const best=old==null?0:old;

 const lent=b.loans.reduce((s,l)=>s+(+l.amount||0),0),paid=b.loans.reduce((s,l)=>s+loanPaid(l),0),owed=b.loans.reduce((s,l)=>s+Math.max(0,loanTot(l)-loanPaid(l)),0);

 const cash=cap-lent+paid-projIn+projBack;
 const inc=b.loans.filter(l=>loanTot(l)>loanPaid(l)).reduce((s,l)=>s+(+l.amount||0)*(+l.rate||0)/100,0)+b.projects.filter(p=>p.status==='finantat').reduce((s,p)=>s+((+p.ret||0)-(+p.invest||0))*12/Math.max(1,+p.months||1),0);
 const yc=cap*cost/100;return{dep,inv,cap,cost,lent,paid,owed,projAct,cash,inc,yc,profit:inc-yc,infl:+b.inflation||0}}
function pc(p,k){const inv=+p.invest||0,ret=+p.ret||0,m=Math.max(1,+p.months||1),roi=inv?(ret-inv)/inv*100:0,an=roi*12/m,need=k.cost+k.infl;

function tips(k){const b=S.bank,t=[];
 if(!k.cap)t.push('🌱 Începe prin a strânge capital: adaugă un <b>deponent</b> sau un <b>investitor</b>.');
 if(k.cash<0)t.push('⚠️ Ai dat cu împrumut sau ai investit mai mulți bani decât ai. Strânge capital nou!');
 if(k.cash>0&&k.cap&&k.cash/k.cap>.4)t.push(`😴 Ai <b>${lei(k.cash)}</b> care stau degeaba. Inflația îi „micșorează” cu cam <b>${lei(k.cash*k.infl/100)}</b> pe an. Caută un proiect bun!`);
 const ideas=b.projects.filter(p=>p.status==='idee').map(p=>({p,c:pc(p,k)})).sort((x,y)=>y.c.an-x.c.an);
 const best=ideas.find(x=>x.c.v[0]==='🟢');if(best)t.push(`🚀 Proiectul <b>${esc(best.p.name)}</b> aduce ${pct(best.c.an)} pe an — peste ${pct(k.cost+k.infl)}. ${(+best.p.invest)<=k.cash?'Ai destui bani: merită finanțat!':`Îți mai lipsesc ${lei(best.p.invest-k.cash)} ca să-l finanțezi.`}`);
 ideas.filter(x=>x.c.v[0]==='🔴').forEach(x=>t.push(`🔴 <b>${esc(x.p.name)}</b> nu merită: aduce doar ${pct(x.c.an)} pe an.`));
 b.loans.forEach(l=>{const s=score(l);if(loanTot(l)>loanPaid(l)){if(s.gr[0]==='D')t.push(`🔴 Atenție la <b>${esc(l.name)}</b>: scor ${s.t}/100, risc mare.`);if((+l.rate||0)<k.cost+k.infl)t.push(`🏷️ Împrumutul lui <b>${esc(l.name)}</b> are dobânda ${pct(l.rate)} — mai mică decât costul banilor + inflația. Pierzi bani!`);
  const due=addM(l.start,+l.months);const n=daysTo(due);if(n>=0&&n<=14)t.push(`⏰ <b>${esc(l.name)}</b> trebuie să returneze banii până pe ${fmtD(due)}.`)}});
 b.deps.forEach(d=>{if(+d.months){const m=addM(d.start,+d.months),n=daysTo(m);if(n>=0&&n<=30)t.push(`📅 Depozitul lui <b>${esc(d.name)}</b> ajunge la termen pe ${fmtD(m)}: pregătește ${lei(depFinal(d)+depInt(d))}.`)}});
 if(k.cap&&k.profit<0)t.push('📉 Plătești mai mult decât câștigi. Caută proiecte cu ROI mai mare sau dă dobânzi mai mici la depozite.');
 if(!t.length)t.push('👍 Banca ta arată bine! Continuă să cauți proiecte profitabile.');return t}

function wrap(x,t,cx,y,w,lh){const ws=t.split(' ');let l='';for(const s of ws){const tt=l?l+' '+s:s;if(x.measureText(tt).width>w&&l){x.fillText(l,cx,y);l=s;y+=lh}else l=tt}x.fillText(l,cx,y);return y}
